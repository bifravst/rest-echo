name: Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  STACK_NAME: ${{ vars.STACK_NAME }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOMAIN_NAMES: ${{ vars.DOMAIN_NAMES }}
  CERTIFICATE_ID: ${{ vars.CERTIFICATE_ID }}
  FORCE_COLOR: 3
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1

jobs:
  deploy:
    runs-on: ubuntu-24.04

    environment: production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "<27"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: github-action-rest-echo
          aws-region: ${{ vars.AWS_REGION }}

      - run: npx cdk diff

      - name: Deploy solution stack
        env:
          RELEASE_IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: npx cdk deploy --require-approval never
