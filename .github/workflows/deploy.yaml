name: Deployment

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

env:
  STACK_NAME: ${{ vars.STACK_NAME }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  DOMAIN_NAMES: ${{ vars.DOMAIN_NAMES }}
  CERTIFICATE_ID: ${{ vars.CERTIFICATE_ID }}
  FORCE_COLOR: 3
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: 1

jobs:
  deploy:
    runs-on: ubuntu-24.04

    environment: production

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          role-session-name: github-action-rest-echo
          aws-region: ${{ vars.AWS_REGION }}

      - run: npx cdk diff

      - name: Deploy solution stack
        env:
          RELEASE_IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: npx cdk deploy --require-approval never
